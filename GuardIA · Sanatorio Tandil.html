.fc b{display:block;font-size:14px;font-weight:600}.fc small{display:block;font-size:12px;color:var(--muted);max-width:210px;line-height:1.3;margin-top:2px}
.fc .d{width:11px;height:11px;border-radius:50%;flex:none;position:relative}.fc .d::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:fcp 2.2s ease-out infinite}
.fc2{right:0;top:0}.fc2 .d{background:#f08a5d}.fc3{right:14px;bottom:-18px;animation-delay:-3.5s}.fc3 .d{background:#33cc7a}
@keyframes fcb{50%{transform:translateY(-9px)}}@keyframes fcp{from{transform:scale(1);opacity:.6}to{transform:scale(3);opacity:0}}
.lp{background-image:radial-gradient(rgba(31,57,84,.09) 1px,transparent 1.2px)}
.lc{max-width:360px}.lc h2{font-size:34px;letter-spacing:-.04em}
.dots{gap:16px;margin-bottom:12px}.dots i{width:16px;height:16px;transition:background .15s,transform .15s}.dots i.on{background:var(--green);border-color:var(--green);transform:scale(1.15)}.dots i{border-color:rgba(31,57,84,.35)}
.kb{height:64px;border-radius:18px;background:#fff;border:1px solid rgba(31,57,84,.12);box-shadow:0 1px 2px rgba(31,57,84,.05),0 6px 14px -8px rgba(31,57,84,.2);font-size:22px}
.kb:hover{border-color:var(--green);box-shadow:0 0 0 3px rgba(86,189,192,.2),0 6px 14px -8px rgba(31,57,84,.2)}
.kb:active{transform:scale(.95);background:var(--green);color:#fff;border-color:var(--green)}
.demo{margin-top:22px;padding-top:18px;border-top:1px solid rgba(31,57,84,.12)}.demo>span{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}.demo>div{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dc{display:inline-flex;flex-direction:column;align-items:center;gap:1px;padding:8px 14px;border-radius:12px;border:1px solid rgba(31,57,84,.14);background:rgba(255,255,255,.7);font-size:13px;font-weight:600;color:var(--navy)}.dc small{font-size:11px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.dc:hover{border-color:var(--green);background:#fff}
