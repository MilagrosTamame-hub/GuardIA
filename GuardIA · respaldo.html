function vNaa(){return`<div class="card"><div class="ch"><div><h2 class="h2">Naaloo → GuardIA</h2><span class="mu">Sincronización de nómina (simulada). Corre cada noche y el día 15 de cada mes.</span></div><button class="btn p" data-a="sync">Sincronizar ahora</button></div>${S.sync?`<div class="ins"><b>Última sincronización: ${S.sync}</b>${S.staff.length} empleados activos. Camila F. tiene licencia prolongada del 16 al 22 de noviembre: GuardIA la marcó como no disponible.</div>`:'<p class="mu">Todavía no se sincronizó en esta sesión.</p>'}</div><div class="card"><div class="ch"><div><h2 class="h2">GuardIA → Naaloo</h2><span class="mu">Novedades para la liquidación: turnos, francos, licencias y horas de suplencia.</span></div><button class="btn p" data-a="csv">Enviar novedades</button></div>${S.env?`<p class="ok" style="margin-bottom:12px">Último envío: ${S.env} (simulado)</p>`:''}<div class="sc"><table class="wt"><tr><th>Empleado</th><th>Turnos</th><th>Noches</th><th>Francos</th><th>Licencias</th><th>Horas de suplencia</th></tr>${S.staff.map((n,s)=>`<tr>${nov(s).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div></div>`}

const th=AI?STEPS.slice(0,AI.n+(ok?0:1)).map((s,i)=>`<div class="stp ${!ok&&i==AI.n?'w':''}"><i></i>${s}${ok||i<AI.n?' ✓':'…'}</div>`).join(''):'';

const evs=[...S.ev].sort((a,b)=>a.d-b.d),warn=[];

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const q=b.dataset,a=q.a;if(a===undefined&&q.s===undefined)return;MSG=null;

else if(a=='req'){const tp=rt.value,d=+rd.value;

else if(a=='sync'){if(!S.sync)S.lic.push({s:4,from:14,to:20});S.sync=new Date().toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'});if(S.sched)genRaw();MSG={g:1,t:'Nómina sincronizada. Camila F. quedó con licencia del 16 al 22 y GuardIA repartió esos turnos entre el resto.'}}
else if(a=='csv'){S.env=new Date().toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'});MSG={g:1,t:`Novedades enviadas a Naaloo: turnos, francos, licencias y horas de suplencia de ${S.staff.length} empleados, listas para la liquidación. En la versión real viaja por API, sin carga manual en RR. HH.`}}
else if(q.s!==undefined){const s=+q.s,d=+q.d,x=S.sched[s][d],n=SH[(SH.indexOf(x)+1)%4],mm=check(s,d,n);if(mm)MSG={t:`No se puede asignar ${NM[n].toLowerCase()} a ${S.staff[s]} el ${dn(d)}. ${mm}`};else{S.sched[s][d]=n;S.pub=false}}
save();render()});
